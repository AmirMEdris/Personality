name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium ffmpeg
      - name: Browser regression and actual-app recording
        run: |
          python -m personality.server &
          timeout 120 python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personality-app-verification
          path: verification/
          if-no-files-found: ignore
          retention-days: 14
